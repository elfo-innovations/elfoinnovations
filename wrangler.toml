# Finding 12: Cloudflare Turnstile site key for the contact/lead form and the
# developer-application form (chatbot is explicitly NOT gated). This is the
# public widget key — safe to ship to the browser, not a secret.
# NOTE: this [vars] entry is a Worker RUNTIME binding only — Vite's build step
# (which produces the browser bundle read by import.meta.env.VITE_*) does NOT
# read wrangler.toml, so this value alone does not reach the client. The
# browser-visible source of truth is the fallback literal in
# src/lib/turnstile-site-key.ts (same pattern already used for
# VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY in
# src/integrations/supabase/client.ts). Keep both in sync if the widget is
# ever recreated with a new site key.
VITE_TURNSTILE_SITE_KEY = "0x4AAAAAAFAEFl_2o7TbU47Z"
# RESEND_API_KEY, SUPABASE_SERVICE_ROLE_KEY, VAPID_PRIVATE_KEY are NOT here on purpose —
# keep those as "Secret" type in the Cloudflare dashboard (Settings > Variables and secrets).
# Secrets persist across deploys automatically and should never be committed to the repo.
# TURNSTILE_SECRET_KEY (Finding 12) follows the same rule: it belongs only in
# Cloudflare Secrets, never in this file — see src/lib/turnstile-verify.server.ts.

